# convex-chat

# Validate commit messages follow Conventional Commits format
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run lint {staged_files}

    build:
      run: bun run build

pre-push:
  parallel: false
  commands:
    build:
      run: bun run build

    test:
      run: bun test
