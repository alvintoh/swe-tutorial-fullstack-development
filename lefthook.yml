# real-time-slack-clone-project

# Validate commit messages follow Conventional Commits format
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      root: "nextjs/realtime-slack-clone-project/"
      run: bun run lint {staged_files}

pre-push:
  parallel: false
  commands:
    build:
      root: "nextjs/realtime-slack-clone-project/"
      run: bun run build

    test:
      root: "nextjs/realtime-slack-clone-project/"
      run: bun test
